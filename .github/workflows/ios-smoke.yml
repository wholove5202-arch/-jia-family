name: iPhone native startup test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-smoke.yml'
      - 'src/**'
      - 'assets/**'
      - 'App.js'
      - 'app.json'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: jia-ios-smoke
  cancel-in-progress: true

jobs:
  launch:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check source and saved-data behavior
        run: |
          npm ci --no-audit --no-fund
          npm run check:syntax
          npm run check:behavior
          npx expo install --check
      - name: Generate native iPhone test project
        run: |
          node <<'JS'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('app.json','utf8'));
          config.expo.ios.bundleIdentifier='com.jia.familymemory.test';
          fs.writeFileSync('app.json',JSON.stringify(config,null,2));
          JS
          npx expo prebuild --platform ios
      - name: Build self-contained iPhone simulator app
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          project=$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)
          scheme=$(basename "$project" .xcodeproj)
          mkdir -p phone-evidence
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO > phone-evidence/build.log 2>&1
      - name: Install and launch on iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(x['udid'] for group in d['devices'].values() for x in group if x.get('isAvailable') and 'iPhone' in x['name']))")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app=$(find build-ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -f "$app/main.jsbundle"
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.jia.familymemory.test | tee phone-evidence/launch.log
          sleep 15
          xcrun simctl spawn "$device" launchctl list | grep com.jia.familymemory.test > phone-evidence/process.log
          xcrun simctl io "$device" screenshot phone-evidence/startup.png
          xcrun simctl spawn "$device" log show --last 2m --style compact --predicate 'process CONTAINS "jia" OR eventMessage CONTAINS "com.jia.familymemory.test"' > phone-evidence/runtime.log
          python3 - <<'PY'
          from pathlib import Path
          process=Path('phone-evidence/process.log').read_text().split()
          assert process[0].isdigit(), 'App has exited after launch'
          logs=Path('phone-evidence/runtime.log').read_text()
          for failure in ['Unable to load script', 'JavascriptException', 'Unhandled JS Exception']:
              assert failure not in logs, failure
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jia-iphone-startup-evidence
          path: phone-evidence/*
          retention-days: 14
