name: Android phone startup test

on:
  workflow_run:
    workflows: ['Android installable test app']
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  launch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download the exact tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$SOURCE_RUN" ]; then
            SOURCE_RUN=$(gh run list --workflow android-test.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$SOURCE_RUN"
          mkdir -p phone-evidence
          echo "$SOURCE_RUN" > phone-evidence/source-build.txt
          gh run download "$SOURCE_RUN" --name jia-android-phone-test --dir phone-test
          cd phone-test
          sha256sum -c SHA256SUMS.txt
      - name: Enable Android acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            adb install phone-test/jia-family-test.apk
            adb logcat -c
            adb shell am start -W -n com.jia.familymemory.test/.MainActivity
            python3 scripts/android-phone-smoke.py
      - name: Publish verified test download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SOURCE_RUN=$(cat phone-evidence/source-build.txt)
          TESTED_SHA=$(gh run view "$SOURCE_RUN" --json headSha --jq .headSha)
          if ! gh release view android-test >/dev/null 2>&1; then
            gh release create android-test --target "$TESTED_SHA" --prerelease --title '家 · Android 手机测试版' --notes '手机测试包，已验证分支设置保存后重启。'
          fi
          gh release upload android-test phone-test/jia-family-test.apk phone-test/SHA256SUMS.txt --clobber
          gh release edit android-test --prerelease --title '家 · Android 手机测试版' --notes "已验证 APK 签名、内置应用、机器人避开底部导航、家庭群键盘发送、消息及备注保存后重启、附件入口与提示关闭、家庭分支设置。版本：$TESTED_SHA。用于手机测试，资料保存在当前设备。"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jia-android-startup-evidence
          path: phone-evidence/*
          retention-days: 14
