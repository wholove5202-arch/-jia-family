name: iPhone Expo Go preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jia-iphone-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXRO_TOKEN }}
      EXPO_NO_DEVTOOLS: "1"
      EXPO_OFFLINE: "0"
    steps:
      - name: Check Expo access
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add the EXRO_TOKEN repository secret first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Expo tunnel
        run: npm install --global '@expo/ngrok@^4.1.0'
      - name: Start real Expo tunnel and show iPhone link
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          echo "Starting Expo tunnel..."
          set +e
          timeout 8m script -q -f -e -c "env -u CI EXPO_NO_DEVTOOLS=1 npx expo start --go --tunnel --port 8081" /dev/null
          code=$?
          set -e

          if [ "$code" -eq 124 ]; then
            echo "Expo preview window finished normally."
            exit 0
          fi

          exit "$code"
