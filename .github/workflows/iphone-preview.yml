name: iPhone Expo Go preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jia-iphone-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXRO_TOKEN }}
    steps:
      - name: Check Expo access
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add the EXRO_TOKEN repository secret from the liupengcheng520 Expo account first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Expo tunnel
        run: npm install --global '@expo/ngrok@^4.1.0'
      - name: Start preview and show iPhone link
        shell: bash
        run: |
          set -euo pipefail
          preview_url=""
          server_pid=""
          for startup in 1 2 3; do
            echo "Starting Expo tunnel (attempt $startup of 3)"
            npx expo start --go --tunnel --port 8081 > /tmp/jia-expo-preview.log 2>&1 &
            server_pid=$!
            for attempt in {1..90}; do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "Expo exited during startup."
                break
              fi
              if grep -q 'Tunnel ready' /tmp/jia-expo-preview.log; then
                # SDK 54 redirects from this endpoint to the Expo Go deep link.
                preview_url=$(curl --silent --max-time 3 --output /dev/null --dump-header - 'http://localhost:8081/_expo/link?platform=ios' | sed -nE 's/^[Ll]ocation:[[:space:]]*(exp:\/\/[^[:space:]]+).*/\1/p' | tr -d '\r' | head -n 1 || true)
                if [[ "$preview_url" == *localhost* || "$preview_url" == *127.0.0.1* ]]; then
                  preview_url=""
                fi
                if [ -n "$preview_url" ]; then
                  break
                fi
              fi
              sleep 2
            done
            if [ -n "$preview_url" ]; then
              break
            fi
            cat /tmp/jia-expo-preview.log
            echo "Expo link response headers (for diagnosis):"
            curl --silent --max-time 3 --output /dev/null --dump-header - 'http://localhost:8081/_expo/link?platform=ios' || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$startup" -lt 3 ]; then
              sleep 5
            fi
          done
          if [ -z "$preview_url" ]; then
            echo "Could not start Expo tunnel or extract its iPhone link after 3 attempts."
            exit 1
          fi
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          echo "Open on your iPhone while this workflow is running: $preview_url"
          {
            echo "## 家 · iPhone 测试"
            echo ""
            echo "在 iPhone 上打开这个链接（Expo Go 已登录 liupengcheng520）："
            echo ""
            echo "[$preview_url]($preview_url)"
            echo ""
            echo "此链接只在本次工作流运行期间有效，最长约 45 分钟。"
          } >> "$GITHUB_STEP_SUMMARY"
          wait "$server_pid"
