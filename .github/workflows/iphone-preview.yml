name: iPhone Expo Go preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jia-iphone-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "1"
      EXPO_TOKEN: ${{ secrets.EXRO_TOKEN }}
    steps:
      - name: Check Expo access
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Add the EXRO_TOKEN repository secret from the liupengcheng520 Expo account first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Expo tunnel
        run: npm install --global '@expo/ngrok@^4.1.0'
      - name: Start preview and show iPhone link
        shell: bash
        timeout-minutes: 8
        run: |
          set -uo pipefail
          preview_url=""
          server_pid=""

          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for startup in 1 2; do
            : > /tmp/jia-expo-preview.log
            echo "Starting Expo tunnel (attempt $startup of 2)"

            CI=1 npx expo start --go --tunnel --port 8081 > /tmp/jia-expo-preview.log 2>&1 &
            server_pid=$!

            for attempt in {1..60}; do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo "Expo exited during startup."
                break
              fi

              preview_url=$(curl --silent --max-time 2 --output /dev/null --dump-header -                 'http://127.0.0.1:8081/_expo/link?platform=ios'                 | sed -nE 's/^[Ll]ocation:[[:space:]]*(exp:\/\/[^[:space:]]+).*/\1/p'                 | tr -d '\r' | head -n 1 || true)

              if [ -n "$preview_url" ] && [[ "$preview_url" != *localhost* ]] && [[ "$preview_url" != *127.0.0.1* ]]; then
                break
              fi
              preview_url=""
              sleep 2
            done

            if [ -n "$preview_url" ]; then
              break
            fi

            echo "Attempt $startup did not produce a usable iPhone link."
            tail -n 120 /tmp/jia-expo-preview.log || true
            cleanup
            server_pid=""
            sleep 3
          done

          if [ -z "$preview_url" ]; then
            echo "Expo tunnel did not become usable within the short retry window."
            echo "Failing now instead of waiting 45 minutes."
            exit 1
          fi

          echo "Open on your iPhone while this workflow is running: $preview_url"
          {
            echo "## 家 · iPhone 测试"
            echo ""
            echo "在 iPhone 上打开这个链接（Expo Go 已登录 liupengcheng520）："
            echo ""
            echo "[$preview_url]($preview_url)"
            echo ""
            echo "此链接只在本次工作流运行期间有效。"
          } >> "$GITHUB_STEP_SUMMARY"

          # Keep the temporary preview alive for up to five minutes.
          for keepalive in {1..150}; do
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 2
          done
